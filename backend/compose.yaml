services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quikpatient
      POSTGRES_USER: qp_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-this}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./artifacts/api-server/docker/init-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qp_admin -d quikpatient"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-dev-only}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-dev-password-change}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"

  migrate:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      MIGRATION_DATABASE_URL: postgresql+psycopg://qp_admin:${POSTGRES_PASSWORD:-local-only-change-this}@db:5432/quikpatient
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    environment:
      PORT: 8080
      MOCK_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://qp_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/quikpatient
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    command: ["celery", "-A", "app.celery_app.celery_app", "worker", "--loglevel=INFO", "--without-gossip", "--without-mingle"]
    environment:
      MOCK_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://qp_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/quikpatient
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    command: ["celery", "-A", "app.celery_app.celery_app", "beat", "--loglevel=INFO"]
    environment:
      MOCK_MODE: "true"
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql+psycopg://qp_app:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}@db:5432/quikpatient
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  streamlit:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]
    environment:
      API_HEALTH_URL: http://api:8080/api/healthz
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
