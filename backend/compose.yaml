services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quik
      POSTGRES_PASSWORD: quik
      POSTGRES_DB: quikpatient
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quik"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ./backend
      dockerfile: artifacts/api-server/Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    ports: ["8000:8080"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}